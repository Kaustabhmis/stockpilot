# Builds the employee punch app into an installable APK.
#
# GitHub's Linux runners already carry the Android SDK, so nobody needs
# Android Studio or a build machine. Actions tab -> Build the Android APK ->
# Run workflow, then download the APK from the run's Artifacts.
name: Build the Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hrms-lite/app/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms-lite/app/android

    steps:
      - uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned because the Android plugin below needs 8.7 or newer.
          gradle-version: '8.9'

      - name: Point the app at the live site
        # One place for the URL: this repository variable, or strings.xml.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            sed -i "s#<string name=\"site_url\">.*</string>#<string name=\"site_url\">$SITE_URL</string>#" \
              app/src/main/res/values/strings.xml
          fi
          grep site_url app/src/main/res/values/strings.xml

      # Debug first: it is the one that cannot fail for signing reasons, so
      # there is always something to install even if the release build trips.
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build the release APK
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect the APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print -exec sh -c \
            'cp "$1" "out/biscs-os-$(basename $(dirname $1))-${{ github.run_number }}.apk"' _ {} \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: biscs-os-apk
          path: hrms-lite/app/android/out/*.apk
          if-no-files-found: error
          retention-days: 90
