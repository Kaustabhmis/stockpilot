# Builds the employee punch app into an installable APK.
#
# GitHub's Linux runners already carry the Android SDK, so nobody needs
# Android Studio or a build machine. Run it from the Actions tab
# (Run workflow) and download the APK from the run's Artifacts.
name: Build the Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hrms-lite/app/android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hrms-lite/app/android

    steps:
      - uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Point the app at the live site
        # Keeps the URL in one place: change it here or in strings.xml.
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            sed -i "s#<string name=\"site_url\">.*</string>#<string name=\"site_url\">$SITE_URL</string>#" \
              app/src/main/res/values/strings.xml
          fi
          grep site_url app/src/main/res/values/strings.xml

      - name: Build
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.7 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name it by run number
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/biscs-os-${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: biscs-os-apk
          path: hrms-lite/app/android/out/*.apk
          retention-days: 90
