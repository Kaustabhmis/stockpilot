<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title><?= companyName ?></title>
  <style>
    body { margin: 0; padding: 0; background: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #1f2937; }
    .wrap { width: 100%; background: #f4f5f7; padding: 24px 0; }
    .card { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
    .header { background: #4f46e5; color: #ffffff; padding: 20px 32px; font-size: 20px; font-weight: bold; }
    .content { padding: 28px 32px; font-size: 16px; line-height: 1.6; }
    .content h1 { font-size: 22px; margin: 0 0 16px; }
    .content a { color: #4f46e5; }
    .btn { display: inline-block; background: #4f46e5; color: #ffffff !important; text-decoration: none; padding: 12px 22px; border-radius: 6px; font-weight: bold; }
    .footer { padding: 20px 32px; font-size: 12px; color: #6b7280; text-align: center; line-height: 1.5; border-top: 1px solid #e5e7eb; }
    .footer a { color: #6b7280; }
    @media (max-width: 620px) {
      .header, .content, .footer { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header"><?= companyName ?></div>
      <div class="content"><?!= body ?></div>
      <div class="footer">
        <p><?= companyName ?> &middot; <?= companyAddress ?></p>
        <p>You are receiving this because you signed up at <?= companyName ?>.<br>
        <a href="<?= unsubscribeUrl ?>">Unsubscribe</a> &middot; <a href="<?= productUrl ?>">Visit our website</a></p>
      </div>
    </div>
  </div>
</body>
</html>
