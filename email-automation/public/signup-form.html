<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscribe</title>
  <style>
    :root { --ink: #1a1a1a; --ivory: #f7f4ee; --paper: #ffffff; --gold: #b8975a; --muted: #8a8377; --hair: #e4ddcd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ivory); color: var(--ink);
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 440px; background: var(--paper); padding: 52px 44px 44px; border: 1px solid var(--hair); }
    .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); text-align: center; margin: 0 0 14px; }
    h2 { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: 30px; line-height: 1.2; text-align: center; margin: 0 0 12px; }
    p.lead { font-size: 14px; line-height: 1.7; color: var(--muted); text-align: center; margin: 0 0 34px; }
    .rule { width: 44px; height: 1px; background: var(--gold); margin: 0 auto 34px; }
    .field { margin-bottom: 22px; }
    label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input[type=text], input[type=email] { width: 100%; border: 0; border-bottom: 1px solid var(--hair); background: transparent;
           padding: 8px 0 10px; font-size: 16px; color: var(--ink); border-radius: 0; font-family: inherit; }
    input:focus { outline: none; border-bottom-color: var(--gold); }
    button { width: 100%; margin-top: 10px; padding: 17px; border: 0; background: var(--ink); color: #fff; cursor: pointer;
             font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-family: inherit; }
    button:hover { background: #000; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 22px; font-size: 14px; line-height: 1.6; text-align: center; min-height: 20px; color: var(--muted); }
    #msg.ok { color: #6b5a33; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 16px; }
    #msg.err { color: #9b2c2c; }
    .fine { margin-top: 26px; font-size: 11px; line-height: 1.6; color: var(--muted); text-align: center; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    @media (max-width: 480px) { .card { padding: 40px 26px 34px; } h2 { font-size: 26px; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">The Journal</p>
    <h2>Stay in the loop</h2>
    <div class="rule"></div>
    <p class="lead">Considered updates, product news and occasional invitations, delivered sparingly. Unsubscribe at any time.</p>

    <form id="signup" novalidate>
      <div class="field">
        <label for="first_name">First name</label>
        <input id="first_name" name="first_name" type="text" autocomplete="given-name" maxlength="100">
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
      </div>
      <div class="field">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" autocomplete="organization" maxlength="100">
      </div>

      <!-- Honeypot: hidden from people; bots tend to fill it in -->
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>

      <input type="hidden" name="plan" value="free">
      <input type="hidden" name="source" value="landing-page">
      <!-- Soft spam guard only: this value is visible in the page source. -->
      <input type="hidden" name="api_key" value="PASTE_SIGNUP_API_KEY_HERE">

      <button id="submit" type="submit">Subscribe</button>
      <div id="msg" role="status"></div>
    </form>

    <p class="fine">By subscribing you agree to receive occasional emails. We respect your privacy and will never share your details.</p>
  </main>

  <script>
    // Paste the deployed Apps Script web app URL (ends in /exec).
    const WEBAPP_URL = 'https://script.google.com/macros/s/PASTE_DEPLOYMENT_ID/exec';

    const form = document.getElementById('signup');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    function show(text, cls) {
      msg.textContent = text;
      msg.className = cls || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email || '')) {
        show('Please enter a valid email address.', 'err');
        return;
      }

      btn.disabled = true;
      show('One moment…');
      try {
        // no-cors + text/plain avoids a CORS preflight. The response is opaque,
        // so success is shown optimistically; the Logs sheet records every signup.
        await fetch(WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data),
        });
        form.reset();
        show('Thank you. Please check your inbox to confirm.', 'ok');
      } catch (err) {
        show('We could not complete that just now. Please try again shortly.', 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
