<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscribe</title>
  <style>
    :root { --brand: #4f46e5; --ink: #1f2937; --muted: #6b7280; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: #f9fafb; }
    .box { max-width: 420px; margin: 48px auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    h2 { margin: 0 0 6px; }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    input:focus { outline: 2px solid var(--brand); border-color: transparent; }
    button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 14px; font-size: 14px; min-height: 18px; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    @media (max-width: 480px) { .box { margin: 16px; padding: 20px; } }
  </style>
</head>
<body>
  <div class="box">
    <h2>Get product updates</h2>
    <p class="lead">Tips, release notes and offers. Unsubscribe anytime.</p>

    <form id="signup" novalidate>
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" autocomplete="given-name" maxlength="100">

      <label for="email">Work email</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">

      <label for="company">Company</label>
      <input id="company" name="company" autocomplete="organization" maxlength="100">

      <!-- Honeypot: hidden from people, bots tend to fill it in -->
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <input type="hidden" name="plan" value="free">
      <input type="hidden" name="source" value="landing-page">
      <!-- Soft spam guard only: this value is visible to anyone who views the page source. -->
      <input type="hidden" name="api_key" value="PASTE_SIGNUP_API_KEY_HERE">

      <button id="submit" type="submit">Subscribe</button>
      <div id="msg" role="status"></div>
    </form>
  </div>

  <script>
    // Paste the deployed Apps Script web app URL (ends in /exec).
    const WEBAPP_URL = 'https://script.google.com/macros/s/PASTE_DEPLOYMENT_ID/exec';

    const form = document.getElementById('signup');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    function show(text, cls) {
      msg.textContent = text;
      msg.className = cls || '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email || '')) {
        show('Please enter a valid email address.', 'err');
        return;
      }

      btn.disabled = true;
      show('Subscribing…');
      try {
        // no-cors + text/plain avoids a CORS preflight. The response is opaque,
        // so we confirm success optimistically; the Logs sheet records every signup.
        await fetch(WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(data),
        });
        form.reset();
        show('Almost done! Check your inbox to confirm your subscription.', 'ok');
      } catch (err) {
        show('Something went wrong. Please try again in a moment.', 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
