<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --ink:#1a1a1a; --ivory:#faf8f3; --gold:#b8975a; --muted:#8a8377; --hair:#e8e2d6; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; color: var(--ink); background: var(--ivory); margin: 0; padding: 18px; }
    .brand { font-family: Georgia, 'Times New Roman', serif; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; }
    .rule { width: 32px; height: 1px; background: var(--gold); margin: 10px 0 18px; }
    h4 { margin: 22px 0 8px; font-size: 10px; font-weight: normal; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); }
    .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--hair); }
    .stat span { color: #4a463f; }
    .stat b { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: 17px; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--hair); }
    th { color: var(--muted); font-weight: normal; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
    td { color: #3d3a35; }
    .note { color: var(--muted); font-size: 11px; line-height: 1.6; margin: 10px 0 0; }
    button { width: 100%; margin-top: 10px; padding: 12px; border: 0; background: var(--ink); color: #fff; cursor: pointer;
             font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-family: inherit; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--hair); }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: default; }
    #msg { margin-top: 14px; min-height: 16px; color: var(--muted); line-height: 1.5; }
    .error { color: #9b2c2c; }
  </style>
</head>
<body>
  <div class="brand">Dispatch</div>
  <div class="rule"></div>

  <div id="stats" class="muted">Loading&hellip;</div>

  <h4>Campaigns</h4>
  <table>
    <thead><tr><th>Name</th><th>Status</th><th>Sent</th></tr></thead>
    <tbody id="camps"></tbody>
  </table>
  <p class="note">Set a campaign's status to <b>scheduled</b> in the Campaigns sheet to send it.</p>

  <button id="run">Run automation now</button>
  <button id="test" class="secondary">Send test to me</button>
  <button id="refresh" class="secondary">Refresh</button>
  <div id="msg"></div>

  <script>
    const $ = id => document.getElementById(id);

    function setMsg(text, isError) {
      $('msg').textContent = text;
      $('msg').className = isError ? 'error' : '';
    }

    function cell(row, text) {
      const td = row.insertCell();
      td.textContent = text == null ? '' : String(text);
    }

    function render(s) {
      const stats = $('stats');
      stats.textContent = '';
      [
        ['Active subscribers', s.active],
        ['Awaiting confirmation', s.pending],
        ['Unsubscribed', s.unsubscribed],
        ['Bounced', s.bounced],
        ['Sends remaining today', s.budgetLeft + ' / ' + s.dailyCap],
      ].forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'stat';
        const a = document.createElement('span');
        a.textContent = label;
        const b = document.createElement('b');
        b.textContent = value;
        row.append(a, b);
        stats.append(row);
      });

      const body = $('camps');
      body.textContent = '';
      if (!s.campaigns.length) {
        cell(body.insertRow(), 'No campaigns yet');
        return;
      }
      s.campaigns.forEach(c => {
        const r = body.insertRow();
        cell(r, c.name);
        cell(r, c.status);
        cell(r, c.sent_count);
      });
    }

    function load() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(err => setMsg('Could not load: ' + err.message, true))
        .getDashboardStats();
    }

    $('run').addEventListener('click', () => {
      $('run').disabled = true;
      setMsg('Running…');
      google.script.run
        .withSuccessHandler(result => { $('run').disabled = false; setMsg(result); load(); })
        .withFailureHandler(err => { $('run').disabled = false; setMsg(err.message, true); })
        .runAutomation();
    });

    $('test').addEventListener('click', () => {
      setMsg('Sending test…');
      google.script.run
        .withSuccessHandler(result => setMsg(result))
        .withFailureHandler(err => setMsg(err.message, true))
        .sendTestEmail();
    });

    $('refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
