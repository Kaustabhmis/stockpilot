<style>
  :root{
    /* Chart series. Validated for the categorical job against this surface:
       lightness band, chroma floor, CVD separation, normal-vision floor and
       3:1 contrast all pass. Status colours are reserved steps, never reused as
       a fourth series, and every status still carries a word or a letter so
       colour never has to be read on its own. */
    --s1:#1e4fbf; --s2:#d97706; --s3:#0f8f84; --s4:#9333ea;
    --good:#067647; --warn:#b54708; --bad:#b42318;
    /* Sequential ramp for the heatmap: one hue, light to dark, monotonic. */
    --r1:#e6eefb; --r2:#a9c1ec; --r3:#4f7fd1; --r4:#17366f;

    /* Corporate palette: navy, blue, teal, with gold only as decoration. */
    --navy:#13294b; --brand:#1e4fbf; --brand-dark:#183f99; --accent:#0c7a71; --gold:#d4930f;
    --surface:#fff; --surface2:#eef1f6; --paper:#f4f6fa; --line:#e2e7ef;
    --ink:#0f1b2d; --ink2:#475467; --muted:#667085;
    --lift:0 10px 24px -8px rgba(15,27,45,.16), 0 2px 6px -2px rgba(15,27,45,.08);
  }
  *{box-sizing:border-box}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:var(--paper);color:var(--ink);margin:0}
  .hidden{display:none !important}
  .material-icons{vertical-align:middle}

  .fade{animation:fade .25s ease-out forwards;opacity:0;transform:translateY(6px)}
  @keyframes fade{to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03)}100%{transform:none;opacity:1}}
  .pop{animation:pop .28s cubic-bezier(.2,1.1,.4,1) forwards}

  /* A board column reads as a tray the cards sit in, with the warm surface
     rather than cold grey — the difference between "spreadsheet" and
     "somewhere you want to spend the morning". */
  .col{background:var(--surface2);border-radius:1.15rem;padding:.75rem;min-height:140px;
       border:1px solid var(--line)}
  .col.over{outline:2px dashed var(--brand);outline-offset:-5px;background:#eaf0fb}

  .card{background:#fff;border-radius:.9rem;padding:.8rem;margin-bottom:.55rem;
        border:1px solid var(--line);cursor:grab;box-shadow:0 1px 2px rgba(15,27,45,.05);
        transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .card:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:#c3cddc}
  .card:active{cursor:grabbing;transform:none}
  .card.drag{opacity:.4;transform:rotate(-1.5deg)}
  /* Priority as a chunky spine down the left: visible at a glance across a full
     board, and paired with the word on the card so it is never colour alone. */
  .card.p-High{border-left:5px solid var(--bad)}
  .card.p-Medium{border-left:5px solid var(--warn)}
  .card.p-Low{border-left:5px solid var(--brand)}

  .chip{display:inline-flex;align-items:center;gap:.25rem;font-size:10px;font-weight:800;
        text-transform:uppercase;letter-spacing:.06em;padding:.2rem .5rem;border-radius:.55rem}

  .in{width:100%;border:1.5px solid var(--line);background:#fbfcfe;border-radius:.8rem;
      padding:.7rem .85rem;font-size:14px;outline:none;font-family:inherit;color:var(--ink);
      transition:border-color .14s ease,box-shadow .14s ease,background .14s ease}
  .in:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(30,79,191,.13)}
  .lb{display:block;font-size:10px;font-weight:800;text-transform:uppercase;
      letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}

  .btn{padding:.7rem 1.3rem;border-radius:.8rem;font-weight:800;font-size:14px;
       border:none;cursor:pointer;font-family:inherit;
       transition:transform .1s ease,box-shadow .14s ease,background .14s ease}
  .btn:active{transform:translateY(1px)}
  .btn-p{background:var(--brand);color:#fff;box-shadow:0 6px 16px -4px rgba(30,79,191,.5)}
  .btn-p:hover{background:var(--brand-dark);box-shadow:0 10px 22px -6px rgba(30,79,191,.55)}
  .btn-g{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
  .btn-g:hover{border-color:#c3cddc;background:#fbfcfe}
  .btn-a{background:var(--accent);color:#fff;box-shadow:0 6px 16px -4px rgba(15,143,132,.4)}
  .btn-a:hover{background:#0b625b}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  #scrim{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:80;
         display:none;align-items:center;justify-content:center;padding:1rem;
         backdrop-filter:blur(2px)}
  #scrim.on{display:flex}
  #scrim.top{z-index:95}  /* a form opened from the task panel sits in front of it */
  #modal{background:#fff;border-radius:1.6rem;width:100%;max-height:90vh;overflow-y:auto;
         box-shadow:0 30px 60px -12px rgba(15,27,45,.4);animation:pop .22s ease-out}
  #drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:520px;background:#fff;
          z-index:90;box-shadow:-20px 0 50px rgba(15,27,45,.22);overflow-y:auto;
          transform:translateX(100%);transition:transform .22s cubic-bezier(.3,1,.4,1)}
  #drawer.on{transform:translateX(0)}
  #drawer:not(.on){box-shadow:none}  /* a closed panel's shadow showed as a grey strip on the right */

  #toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;display:flex;
          flex-direction:column;gap:.5rem;pointer-events:none}
  .toast{padding:.8rem 1.1rem;border-radius:.9rem;font-weight:700;font-size:13px;color:#fff;
         box-shadow:0 14px 30px rgba(15,27,45,.28);max-width:360px;animation:pop .24s ease-out}
  .toast.ok{background:var(--good)} .toast.err{background:var(--bad)}
  .toast.info{background:var(--ink)} .toast.win{background:var(--accent)}

  .gridline{stroke:var(--line);stroke-width:1}
  text.axis{font-size:11px;fill:var(--muted);font-weight:600}
  text.dlabel{font-size:11px;fill:var(--ink);font-weight:800}
  #chartHeat{overflow-x:auto}
  .empty{padding:28px 4px;color:var(--muted);font-size:13px;font-weight:600}

  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ink);
       color:#fff;border-radius:12px;padding:10px 12px;font-size:12px;z-index:9999;
       box-shadow:0 14px 30px rgba(15,27,45,.3);min-width:150px}
  #tip .t{font-weight:800;margin-bottom:6px}
  #tip .r{display:flex;justify-content:space-between;gap:18px;padding:2px 0;color:#c3cddc}
  #tip .r b{color:#fff}

  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
          color:var(--muted);font-weight:800;padding:10px 14px;border-bottom:1.5px solid var(--line);
          white-space:nowrap}
  .tbl td{padding:11px 14px;border-bottom:1px solid #eef1f6;color:var(--ink2)}
  .tbl tbody tr:hover{background:#f6f8fb}

  .seg{border:1px solid var(--line)}
  .seg button{padding:8px 16px;border-radius:10px;font-weight:800;font-size:13px;color:var(--ink2);
              border:none;background:none;cursor:pointer;font-family:inherit;transition:all .14s ease}
  .seg button.on{background:var(--brand);color:#fff;box-shadow:0 3px 10px -2px rgba(30,79,191,.5)}

  /* A dot grid on the dark sections, so a full-width band of colour has some
     texture to it instead of reading as a slab. */
  .dotted{background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);
          background-size:22px 22px}

  /* ---------- the tint set -------------------------------------------------
     Ten light surfaces, each with an ink from the same hue. Every pair clears
     4.5:1, so a tint is always a readable label and never just decoration.
     They are assigned from a hash of the thing's name, so a category or a
     person keeps the same colour on every screen, forever — a colour that
     moves between renders is worse than no colour at all. */
  .t-violet{background:#efecfe;color:#4a3bc4} .t-coral{background:#fdeee8;color:#a33616}
  .t-teal  {background:#e4f5f2;color:#0b6f64} .t-amber{background:#fdf1dc;color:#8a5d0c}
  .t-rose  {background:#fdeaf0;color:#a01443} .t-sky  {background:#e5f1fd;color:#1d5fa8}
  .t-lime  {background:#eef6dd;color:#4f6b14} .t-plum {background:#f4ebfa;color:#6b2e8f}
  .t-slate {background:#eeedf2;color:#44405a} .t-rust {background:#fbeee4;color:#8a4a12}

  /* Solid versions, for an avatar or a counter that needs to carry weight. */
  .s-violet{background:#5b4bdb} .s-coral{background:#d4541f} .s-teal{background:#0e8f80}
  .s-amber {background:#b07d12} .s-rose {background:#c2185b} .s-sky {background:#2a74c9}
  .s-lime  {background:#6b8f1a} .s-plum {background:#8e3fb8} .s-slate{background:#5e5873}
  .s-rust  {background:#a9591a}
  .av{color:#fff;font-weight:900;display:inline-flex;align-items:center;justify-content:center;
      border-radius:999px;flex-shrink:0;letter-spacing:.02em}

  /* ---------- the board, read left to right -------------------------------
     Each column carries the colour of the state it holds, so the eye learns
     the flow instead of re-reading five identical beige trays. The stripe is
     at the top of the tray, never the only signal: the heading still says the
     word. */
  .col{position:relative;padding-top:1rem}
  .col::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;
               border-radius:1rem 1rem 0 0;background:var(--col-tone,#c3cddc)}
  .colhead{display:inline-flex;align-items:center;gap:6px}
  .coldot{width:9px;height:9px;border-radius:999px;background:var(--col-tone,#c3cddc);flex-shrink:0}

  /* ---------- stat tiles --------------------------------------------------- */
  .tile{background:#fff;border:1.5px solid var(--line);border-radius:1.15rem;padding:1rem;
        position:relative;overflow:hidden;transition:transform .14s ease,box-shadow .14s ease}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--lift)}
  .tile .tv{font-size:1.9rem;font-weight:900;line-height:1.1;margin-top:.15rem}
  .tile .tk{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
            color:var(--muted)}
  .tile .ts{font-size:11px;font-weight:700;color:var(--muted);margin-top:.1rem}
  .tile .ti{position:absolute;right:.7rem;top:.7rem;opacity:.9}
  .tile.lead{cursor:pointer}
  .tile.lead:hover{border-color:#a9c1ec}
  /* A thin brand rule along the top of every stat tile — the dashboard reads as
     one set of instruments rather than loose white boxes. */
  .tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--tile-tone,var(--brand))}

  /* ---------- the home page: built to sell ------------------------------- */
  .hero-bg{background:radial-gradient(900px 460px at 92% -10%,#dfe9fb 0%,rgba(223,233,251,0) 62%),
                      radial-gradient(640px 380px at 0% 10%,#e2f4f1 0%,rgba(226,244,241,0) 60%),#fff}
  .browser-frame{margin:0;border-radius:14px;overflow:hidden;background:#fff;border:1px solid #d5dce8;
                 box-shadow:0 24px 50px -18px rgba(15,27,45,.35),0 4px 12px -4px rgba(15,27,45,.12)}
  .browser-frame img{display:block;width:100%;height:auto}
  .browser-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#eef1f6;border-bottom:1px solid #dde3ec}
  .browser-bar i{width:9px;height:9px;border-radius:50%;background:#c3cddc;display:inline-block}
  .browser-bar span{margin-left:10px;font-size:11px;font-weight:700;color:#667085;background:#fff;border-radius:6px;padding:2px 10px}
  .tour-tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tour-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;
                    font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .tour-tabs button .material-icons{font-size:18px}
  .tour-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tour-point{display:flex;gap:10px;margin-top:12px;font-size:14.5px;font-weight:600;color:var(--ink2);line-height:1.55}
  .tour-point .material-icons{color:var(--accent);font-size:20px;flex-shrink:0;margin-top:1px}
  .demo-pick{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid #c9d7ef;
             border-radius:16px;padding:14px 16px;cursor:pointer;font-family:inherit;transition:box-shadow .14s ease,transform .14s ease}
  .demo-pick:hover{box-shadow:var(--lift);transform:translateY(-1px)}
  .demo-pick .material-icons{background:var(--navy);color:#fff;border-radius:12px;padding:8px}
  .demo-pick b{display:block;font-weight:900;color:var(--ink)} .demo-pick small{display:block;font-weight:600;color:var(--ink2);font-size:13px}
  .step{border:1.5px solid var(--line);border-radius:20px;padding:20px;background:#fff}
  .step span{display:inline-flex;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;font-weight:900;
             align-items:center;justify-content:center}
  .step h3{font-weight:900;margin:10px 0 4px} .step p{font-size:14px;font-weight:600;color:var(--ink2);line-height:1.55}
  .roi-big{font-size:2.1rem;font-weight:900;line-height:1.1;color:var(--ink)}
  .roi-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink2)}
  .roi-row b{color:var(--ink)}
  .cmp{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
  .cmp-row{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:12px;padding:13px 18px;border-top:1px solid var(--line);
           font-size:14px;font-weight:600;color:var(--ink2)}
  .cmp-row span:first-child{font-weight:800;color:var(--ink)}
  .cmp-row span:last-child{color:#067647;font-weight:800}
  .cmp-head{border-top:0;background:var(--navy);color:#fff !important;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .cmp-head span{color:#fff !important}
  @media(max-width:640px){ .cmp-row{grid-template-columns:1fr} .cmp-head{display:none} }
  .faq details{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;margin:8px 0}
  .faq summary{font-weight:800;cursor:pointer;color:var(--ink)}
  .faq p{margin:8px 0 0;font-size:14.5px;font-weight:600;color:var(--ink2);line-height:1.6}
  .sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:8px;padding:10px 12px;
              background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -6px 18px -8px rgba(15,27,45,.2)}

  /* ---------- home page colour: corporate navy, blue, teal, with gold to act on ----------
     Gold is used for ONE thing — the button that starts a trial — so the eye
     always finds the next step. Navy carries authority, teal the good news,
     blue the product. Every text pair here clears WCAG AA. */
  .btn-gold{background:#f5b301;color:#0f1b2d;box-shadow:0 10px 24px -8px rgba(245,179,1,.6)}
  .btn-gold:hover{background:#ffc21a;box-shadow:0 14px 30px -8px rgba(245,179,1,.7)}
  .btn-ghost-light{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
  .btn-ghost-light:hover{background:rgba(255,255,255,.16)}
  .hero-navy{position:relative;color:#fff;overflow:hidden;
    background:radial-gradient(700px 420px at 85% 15%,rgba(46,111,228,.55) 0%,rgba(46,111,228,0) 65%),
               radial-gradient(520px 360px at 5% 100%,rgba(15,143,132,.45) 0%,rgba(15,143,132,0) 65%),
               linear-gradient(135deg,#0a1628 0%,#13294b 48%,#1a3f8f 100%)}
  .hero-navy::after{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px}
  .hero-navy > *{position:relative;z-index:1}
  .hero-navy .kicker{color:#7fb2ff}
  .hero-navy .gold{color:#f5c542}
  .hero-navy .lede{color:#c9d6ea}
  /* ---------- dialogs: error, warning, success, question ---------- */
  #dlgScrim{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(15,27,45,.55);backdrop-filter:blur(2px)}
  #dlgScrim.on{display:flex;animation:dlgFade .15s ease-out}
  #dlgScrim.lite{background:transparent;backdrop-filter:none;pointer-events:none;align-items:flex-start;padding-top:84px}
  #dlgScrim.lite .dlg{pointer-events:auto;max-width:380px;padding:22px 22px 18px}
  .dlg{position:relative;width:100%;max-width:420px;background:#fff;border-radius:22px;padding:28px 26px 22px;text-align:center;
    overflow:hidden;box-shadow:0 30px 70px -20px rgba(15,27,45,.55);
    animation:dlgPop .2s cubic-bezier(.2,.9,.3,1.2)}
  .dlg::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--dlg-c,#1e4fbf)}
  .dlg-error{--dlg-c:#b42318;--dlg-bg:#fef3f2}
  .dlg-warning{--dlg-c:#b54708;--dlg-bg:#fffaeb}
  .dlg-success{--dlg-c:#067647;--dlg-bg:#ecfdf3}
  .dlg-confirm{--dlg-c:#1e4fbf;--dlg-bg:#eef4ff}
  .dlg-icon{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--dlg-bg);color:var(--dlg-c);box-shadow:0 0 0 8px color-mix(in srgb,var(--dlg-bg) 55%,transparent)}
  .dlg-icon .material-icons{font-size:36px}
  .dlg-title{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
  .dlg-msg{margin-top:8px;font-size:14.5px;line-height:1.55;font-weight:600;color:var(--ink2);white-space:pre-line;word-break:break-word}
  .dlg-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
