<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dome Box — Task &amp; Team Management</title>
<meta name="description" content="Task and team management for Indian MSMEs: delegation scoring, KRA/KPI tracking and automated appraisals.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M 10 70 A 40 40 0 0 1 90 70' fill='rgba(59,130,246,0.2)' stroke='%233b82f6' stroke-width='4'/%3E%3Ccircle cx='50' cy='25' r='8' fill='%23f59e0b'/%3E%3Ccircle cx='30' cy='55' r='8' fill='%2310b981'/%3E%3Ccircle cx='70' cy='55' r='8' fill='%230ea5e9'/%3E%3Cpath d='M 50 33 L 50 55 M 30 55 L 70 55' stroke='%2394a3b8' stroke-width='4'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=block" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
<style>
  :root{
    /* Validated against a white surface: all-pairs CVD separation and contrast
       pass. Status colours pass too, but every status is still paired with a
       word or a letter so colour never carries the meaning alone. */
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#047857; --warn:#d97706; --bad:#b91c1c;
    --r1:#9dc6f0; --r2:#4a8ede; --r3:#1f5fae; --r4:#0f3563;
    --surface:#fff; --surface2:#f1f5f9; --line:#e5e7eb;
    --ink:#111827; --ink2:#4b5563; --muted:#9ca3af;
  }
  *{box-sizing:border-box}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:#f3f4f6;color:var(--ink);margin:0}
  .hidden{display:none !important}
  .material-icons{vertical-align:middle}

  .fade{animation:fade .25s ease-out forwards;opacity:0;transform:translateY(6px)}
  @keyframes fade{to{opacity:1;transform:none}}

  .col{background:var(--surface2);border-radius:1rem;padding:.75rem;min-height:140px}
  .col.over{outline:2px dashed #2563eb;outline-offset:-4px;background:#eff6ff}
  .card{background:#fff;border-radius:.75rem;padding:.75rem;margin-bottom:.5rem;
        border:1px solid var(--line);cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card:active{cursor:grabbing}
  .card.drag{opacity:.4}
  .card.p-High{border-left:4px solid var(--bad)}
  .card.p-Medium{border-left:4px solid var(--warn)}
  .card.p-Low{border-left:4px solid var(--s1)}

  .chip{display:inline-flex;align-items:center;gap:.25rem;font-size:10px;font-weight:800;
        text-transform:uppercase;letter-spacing:.06em;padding:.15rem .45rem;border-radius:.4rem}

  .in{width:100%;border:1px solid var(--line);background:#f9fafb;border-radius:.75rem;
      padding:.65rem .8rem;font-size:14px;outline:none;font-family:inherit}
  .in:focus{border-color:#2563eb;background:#fff}
  .lb{display:block;font-size:10px;font-weight:800;text-transform:uppercase;
      letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
  .btn{padding:.65rem 1.25rem;border-radius:.75rem;font-weight:800;font-size:14px;
       border:none;cursor:pointer;font-family:inherit}
  .btn-p{background:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
  .btn-p:hover{background:#1d4ed8}
  .btn-g{background:#fff;color:var(--ink2);border:2px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  #scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;
         display:none;align-items:center;justify-content:center;padding:1rem}
  #scrim.on{display:flex}
  #modal{background:#fff;border-radius:1.5rem;width:100%;max-height:90vh;overflow-y:auto;
         box-shadow:0 25px 50px -12px rgba(0,0,0,.35)}
  #drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:520px;background:#fff;
          z-index:90;box-shadow:-20px 0 50px rgba(0,0,0,.2);overflow-y:auto;
          transform:translateX(100%);transition:transform .2s ease-out}
  #drawer.on{transform:translateX(0)}

  #toasts{position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;display:flex;
          flex-direction:column;gap:.5rem;pointer-events:none}
  .toast{padding:.75rem 1rem;border-radius:.75rem;font-weight:700;font-size:13px;color:#fff;
         box-shadow:0 10px 25px rgba(0,0,0,.2);max-width:360px}
  .toast.ok{background:var(--good)} .toast.err{background:var(--bad)} .toast.info{background:#1f2937}

  .gridline{stroke:var(--line);stroke-width:1}
  text.axis{font-size:11px;fill:var(--muted);font-weight:600}
  text.dlabel{font-size:11px;fill:var(--ink);font-weight:800}
  #chartHeat{overflow-x:auto}
  .empty{padding:28px 4px;color:var(--muted);font-size:13px;font-weight:600}

  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;background:#111827;
       color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;z-index:9999;
       box-shadow:0 12px 28px rgba(0,0,0,.24);min-width:150px}
  #tip .t{font-weight:800;margin-bottom:6px}
  #tip .r{display:flex;justify-content:space-between;gap:18px;padding:2px 0;color:#d1d5db}
  #tip .r b{color:#fff}

  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
          color:var(--muted);font-weight:800;padding:10px 14px;border-bottom:1px solid var(--line);
          white-space:nowrap}
  .tbl td{padding:10px 14px;border-bottom:1px solid #f3f4f6;color:var(--ink2)}
  .tbl tbody tr:hover{background:#f8fafc}

  .seg button{padding:8px 16px;border-radius:10px;font-weight:800;font-size:13px;color:var(--ink2);
              border:none;background:none;cursor:pointer;font-family:inherit}
  .seg button.on{background:#2563eb;color:#fff}

  @media(max-width:900px){ .card-12{grid-column:span 12 !important} }

  /* Own responsive helpers rather than Tailwind's `hidden md:flex`. The .hidden
     rule above carries !important so a view stays closed even if the Tailwind
     CDN fails — but that same !important also beats `md:flex`, which would have
     left half the nav permanently invisible. These hide without .hidden, so the
     element's natural display survives. */
  @media(max-width:639px){ .sm-up{display:none !important} }
  @media(max-width:767px){ .md-up{display:none !important} }
  @media(min-width:768px){ .md-down{display:none !important} }
</style>
</head>
<body class="antialiased">
