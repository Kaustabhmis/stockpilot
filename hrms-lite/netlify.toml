# Netlify config for HRMS Lite.
#
# This repository's root is a different (Next.js) project, so in Netlify set
#   Site configuration -> Build & deploy -> Base directory = hrms-lite
# and Netlify will read this file. The "build" just copies the one file we
# publish into site/, so nothing else in this folder - the Apps Script
# backend, the LAN agent, the README - ever reaches the internet.

[build]
  publish = "site"
  command = """
    mkdir -p site/app
    cp index.html manifest.webmanifest sw.js site/
    cp app/index.html app/app.webmanifest app/app-sw.js site/app/
    cp -r app/icons site/app/
  """

# The app is one file and it changes when HR pushes a fix. Never let a browser
# serve staff a stale copy.
# The service worker must never be cached, or a phone keeps yesterday's app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Nobody frames the sign-in page inside another site.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # Google never learns which page of ours the request came from.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Geofenced punching needs the browser's location on this site, and
    # nothing else needs a camera, a microphone or a payment sheet.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
    # The app is a single self-contained file. The only places it may talk to
    # are the two possible workspaces - the Apps Script one and a Supabase
    # one. script.google.com is also under script-src because the JSONP
    # fallback loads from there when a browser cannot POST.
    #
    # Both are listed on purpose. A site serving the Postgres build with only
    # the Apps Script host allowed would fail at the browser, after a
    # deploy that looked perfectly successful, with nothing in the app to
    # say why. Allowing a host the build never calls costs nothing.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.supabase.co; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
