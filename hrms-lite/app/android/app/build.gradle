plugins { id 'com.android.application' }

android {
    namespace 'com.dynamicengineers.biscs'
    compileSdk 34

    defaultConfig {
        applicationId "com.dynamicengineers.biscs"
        minSdk 24                 // Android 7 and up - covers the old phones on a shop floor
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed by the CI workflow when a keystore secret is present,
            // otherwise the debug key is used so there is always an APK.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
