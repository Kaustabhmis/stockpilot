<body data-page="gallery" class="bg-brand-cream text-gray-800 font-sans antialiased overflow-x-hidden pt-20">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[200] focus:bg-brand-navy focus:text-white focus:px-4 focus:py-2 focus:rounded" aria-label="Skip to main content">Skip to main content</a>
    <!--@header--><div id="site-header-root"></div><!--/@header-->

    <main id="main-content">
    <section class="relative bg-brand-navy text-white overflow-hidden" aria-labelledby="page-title">
        <img src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1800&amp;q=70" alt="" class="absolute inset-0 w-full h-full object-cover opacity-30" data-c-attr="src:gallery_image" fetchpriority="high" width="1800" height="600">
        <div class="absolute inset-0 bg-gradient-to-r from-brand-navy via-brand-navy/85 to-brand-navy/40" aria-hidden="true"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
            <p class="eyebrow text-brand-gold">Projects &amp; Gallery</p>
            <h1 id="page-title" class="text-5xl md:text-7xl mt-4 max-w-4xl leading-[0.95]" data-c="gallery_heading">Our Projects</h1>
            <p class="mt-6 text-lg text-gray-200 max-w-2xl leading-relaxed" data-c="gallery_intro">Ongoing developments, sold-out landmarks and commercial spaces across Kolkata. Tap any project for photos, details and prices.</p>
        </div>
    </section>

        <section class="py-12 md:py-16" aria-label="Project gallery">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-8 border-b border-brand-sand">
                    <div class="flex flex-wrap gap-2" role="group" aria-label="Filter by status" id="status-filters">
                        <button type="button" data-status="all" class="filter-btn" aria-pressed="true">All</button>
                        <button type="button" data-status="live" class="filter-btn" aria-pressed="false">Ongoing</button>
                        <button type="button" data-status="sold" class="filter-btn" aria-pressed="false">Sold Out</button>
                        <button type="button" data-status="completed" class="filter-btn" aria-pressed="false">Completed</button>
                        <button type="button" data-status="commercial" class="filter-btn" aria-pressed="false">Commercial</button>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <label class="sr-only" for="loc-filter">Location</label>
                        <select id="loc-filter" class="px-4 py-3 bg-white border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame" data-c-list="lp_locations"><option value="">Any location</option></select>
                        <label class="sr-only" for="q-filter">Search projects</label>
                        <input id="q-filter" type="search" placeholder="Search projects…" class="px-4 py-3 bg-white border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame">
                    </div>
                </div>
                <p id="result-count" class="mt-6 text-sm text-gray-600" aria-live="polite"></p>
                <h2 class="sr-only">All projects</h2>
                <div id="gallery-grid" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-12"><!--@grid--><div class="skeleton aspect-[4/3] rounded-xl"></div><div class="skeleton aspect-[4/3] rounded-xl hidden sm:block"></div><div class="skeleton aspect-[4/3] rounded-xl hidden lg:block"></div><!--/@grid--></div>
                <p id="no-results" class="hidden text-center text-gray-600 py-16">No projects match these filters.</p>
            </div>
        </section>
    </main>

    <!--@footer--><div id="site-footer-root"></div><!--/@footer-->

    <script src="assets/js/config.js"></script>
    <script src="assets/js/templates.js"></script>
    <script src="assets/js/content.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/store.js"></script>
    <script>
    (function () {
        'use strict';
        const T = AE.T;
        AE.layout('gallery');
        const params = new URLSearchParams(location.search);
        let status = params.get('status') || 'all';
        const locSel = document.getElementById('loc-filter');
        const q = document.getElementById('q-filter');
        if (params.get('q')) q.value = params.get('q');

        function applyFilters() {
            const loc = (locSel.value || '').toLowerCase();
            const text = q.value.trim().toLowerCase();
            let shown = 0;
            document.querySelectorAll('#gallery-grid .project-card').forEach((card) => {
                const ok = (status === 'all' || card.dataset.stage === status)
                    && (!loc || card.dataset.location.toLowerCase().includes(loc))
                    && (!text || card.dataset.search.includes(text));
                card.classList.toggle('hidden', !ok);
                if (ok) shown++;
            });
            document.querySelectorAll('#status-filters [data-status]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.status === status)));
            document.getElementById('result-count').textContent = `${shown} project${shown === 1 ? '' : 's'}`;
            document.getElementById('no-results').classList.toggle('hidden', shown > 0);
        }
        document.getElementById('status-filters').addEventListener('click', (e) => {
            const b = e.target.closest('[data-status]');
            if (b) { status = b.dataset.status; applyFilters(); }
        });
        locSel.addEventListener('change', applyFilters);
        q.addEventListener('input', applyFilters);

        async function load() {
            try {
                const [projects, commercial] = await Promise.all([Store.list('projects'), Store.list('commercial')]);
                const ordered = projects.filter((p) => p.stage === 'live').concat(projects.filter((p) => p.stage === 'sold'), projects.filter((p) => p.stage === 'completed'));
                const html = ordered.map((p) => T.projectCard(p, AE.ctx())).join('') + commercial.map((b) => T.commercialCard(b, AE.ctx())).join('');
                const grid = document.getElementById('gallery-grid');
                if (grid.innerHTML.trim() !== html.trim()) grid.innerHTML = html;
            } catch (ex) { console.error(ex); }
            applyFilters();
        }
        AE.onContent(() => { if (params.get('loc')) locSel.value = params.get('loc'); applyFilters(); });
        if (params.get('loc')) locSel.value = params.get('loc');
        load();
        Store.onChange((c) => { if (c === 'projects' || c === 'commercial') load(); });
    })();
    </script>
</body>
