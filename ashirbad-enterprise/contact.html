<body data-page="contact" class="bg-brand-cream text-gray-800 font-sans antialiased overflow-x-hidden pt-20">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[200] focus:bg-brand-navy focus:text-white focus:px-4 focus:py-2 focus:rounded" aria-label="Skip to main content">Skip to main content</a>
    <!--@header--><div id="site-header-root"></div><!--/@header-->

    <main id="main-content">
    <section class="relative bg-brand-navy text-white overflow-hidden" aria-labelledby="page-title">
        <div class="absolute inset-0 bg-gradient-to-r from-brand-navy via-brand-navy/85 to-brand-navy/40" aria-hidden="true"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24">
            <p class="eyebrow text-brand-gold">Get in touch</p>
            <h1 id="page-title" class="text-5xl md:text-7xl mt-4 max-w-4xl leading-[0.95]" data-c="contact_heading">Contact Us</h1>
            <p class="mt-6 text-lg text-gray-200 max-w-2xl leading-relaxed" data-c="contact_intro">Share your requirements and our project head will get back to you within 24 hours.</p>
        </div>
    </section>

        <section class="py-16 md:py-24" aria-label="Contact details and form">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-5 gap-10">
                <div class="lg:col-span-2 bg-white border border-brand-sand rounded-2xl px-6 sm:px-8 py-3 h-fit" data-c-list="@contact_cards_light"></div>
                <div class="lg:col-span-3 bg-white border border-brand-sand rounded-2xl p-6 sm:p-10 shadow-xl">
                    <h2 class="text-4xl text-brand-navy" data-c="contact_form_heading">Send us a message</h2>
                    <form id="contact-form" class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-5" novalidate aria-label="Contact form">
                        <div><label for="cf-name" class="block text-sm font-bold text-brand-navy mb-1.5">Full name <span class="text-brand-orange" aria-hidden="true">*</span></label><input id="cf-name" name="name" type="text" required minlength="2" autocomplete="name" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"><p id="cf-name-error" class="hidden text-red-700 text-xs mt-1">Please enter your name.</p></div>
                        <div><label for="cf-phone" class="block text-sm font-bold text-brand-navy mb-1.5">Mobile number <span class="text-brand-orange" aria-hidden="true">*</span></label><input id="cf-phone" name="phone" type="tel" required inputmode="tel" autocomplete="tel" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"><p id="cf-phone-error" class="hidden text-red-700 text-xs mt-1">Please enter a valid 10-digit mobile number.</p></div>
                        <div><label for="cf-email" class="block text-sm font-bold text-brand-navy mb-1.5">Email <span class="font-normal text-gray-500">(optional)</span></label><input id="cf-email" name="email" type="email" autocomplete="email" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"></div>
                        <div><label for="cf-interest" class="block text-sm font-bold text-brand-navy mb-1.5">Interested in</label><select id="cf-interest" name="interest" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"><option value="">Select</option><option>Buying a Flat</option><option>Commercial Property</option><option>Plot / Land</option><option>Land Owner / Joint Venture</option><option>Other</option></select></div>
                        <div class="sm:col-span-2"><label for="cf-project" class="block text-sm font-bold text-brand-navy mb-1.5">Project</label><select id="cf-project" name="project" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"><option value="">Not decided yet</option></select></div>
                        <div class="sm:col-span-2"><label for="cf-message" class="block text-sm font-bold text-brand-navy mb-1.5">Message</label><textarea id="cf-message" name="message" rows="5" class="w-full px-4 py-3 bg-brand-cream border border-brand-sand rounded-md text-base focus:outline-none focus:ring-2 focus:ring-brand-flame"></textarea></div>
                        <div class="sm:col-span-2"><button type="submit" class="w-full sm:w-auto bg-brand-navy hover:bg-brand-orange text-white font-bold px-10 py-4 rounded-md transition" aria-label="Send message">Send Message</button></div>
                        <p class="sm:col-span-2 hidden text-sm rounded-md p-3" data-form-status role="status" aria-live="polite"></p>
                        <p class="sm:col-span-2 text-xs text-gray-500">By submitting you agree to our <a href="privacy.html" class="underline" aria-label="Privacy Policy">Privacy Policy</a>.</p>
                    </form>
                </div>
            </div>
        </section>
        <section aria-label="Office location map">
            <div id="office-map" class="w-full h-[420px] bg-brand-cream relative z-0" data-lite-map data-lat="22.5979" data-lng="88.4608" data-title="Ashirbad Enterprise" data-c-attr="data-lat:office_lat;data-lng:office_lng;data-title:business_name;data-address:address" role="region" aria-label="Map showing our office"><p class="h-full flex items-center justify-center text-sm text-gray-600">Loading map…</p></div>
        </section>

    <script src="assets/js/config.js"></script>

    <script>
    (function () {
        'use strict';
        AE.layout('contact');
        AE.onContent(() => AE.initLiteMaps());

        /** Wire an enquiry form to Store.addLead (used on contact & project pages). */
        function wireLeadForm(form, extra, onOk) {
            const status = form.querySelector('[data-form-status]') || form.querySelector('.pf-status');
            const nameEl = form.querySelector('[name="name"]');
            const phoneEl = form.querySelector('[name="phone"]');
            phoneEl.pattern = AE.PHONE_PATTERN;
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const ok = [nameEl, phoneEl].every((el) => AE.validateField(el));
                const show = (msg, good) => { status.textContent = msg; status.className = `text-sm rounded-md p-3 ${good ? 'bg-green-50 text-green-800 border border-green-300' : 'bg-red-50 text-red-800 border border-red-300'}`; };
                if (!ok) { show('Please enter your name and a valid 10-digit mobile number.', false); (nameEl.getAttribute('aria-invalid') === 'true' ? nameEl : phoneEl).focus(); return; }
                const btn = form.querySelector('button[type="submit"]');
                const label = btn.innerHTML;
                btn.disabled = true; btn.textContent = 'Sending…';
                const fd = new FormData(form);
                const lead = { name: fd.get('name').trim(), phone: fd.get('phone').trim(), email: (fd.get('email') || '').trim(), message: (fd.get('message') || '').trim(), interest: fd.get('interest') || null, project: fd.get('project') || null, ...extra() };
                try {
                    await Promise.all([Store.addLead(lead), new Promise((r) => setTimeout(r, 700))]);
                    form.reset();
                    show(onOk ? onOk() : 'Thank you! We will call you shortly.', true);
                    if (typeof window.gtag === 'function') window.gtag('event', 'generate_lead', { event_label: lead.project || lead.source });
                } catch (ex) {
                    console.error(ex);
                    show(`Sorry, we could not send your enquiry. Please call ${AE.content().phone} or message us on WhatsApp.`, false);
                } finally { btn.disabled = false; btn.innerHTML = label; }
            });
        }

        const params = new URLSearchParams(location.search);
        const form = document.getElementById('contact-form');
        if (params.get('interest')) {
            const v = params.get('interest');
            document.getElementById('cf-message').value = `I am interested in ${v}. Please share details.`;
            if (/commercial/i.test(v)) document.getElementById('cf-interest').value = 'Commercial Property';
        }
        wireLeadForm(form, () => ({ source: 'Contact page' }), () => AE.content().contact_success);
        Store.list('projects').then((all) => {
            const sel = document.getElementById('cf-project');
            all.filter((p) => p.stage === 'live').forEach((p) => { const o = document.createElement('option'); o.textContent = p.title; sel.appendChild(o); });
        }).catch(() => {});
    })();
    </script>
